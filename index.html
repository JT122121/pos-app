<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2b3c">
<title>My App</title>
<!-- Works even if JavaScript is off -->
<meta http-equiv="refresh" content="0; url=https://www.appsheet.com/start/d1803876-3d59-4959-ad76-5da17b09ad7a">
<style>
  html, body {
    margin: 0; height: 100%; height: 100dvh;
    background: #1a2b3c; color: #e8eef4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
    box-sizing: border-box; text-align: center;
  }
  .ring {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.2); border-top-color: #7cc4ff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 2s; } }
  a {
    display: none; padding: 12px 22px; border-radius: 8px;
    background: #7cc4ff; color: #1a2b3c; text-decoration: none; font-weight: 600;
  }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  a.show { display: inline-block; }
</style>
</head>
<body>
  <div class="ring"></div>
  <p>Opening the app…</p>
  <a id="go" href="https://www.appsheet.com/start/d1803876-3d59-4959-ad76-5da17b09ad7a">Open the app</a>

<script>
  const APP_URL = 'https://www.appsheet.com/start/d1803876-3d59-4959-ad76-5da17b09ad7a';
  // replace() so the Back button doesn't bounce people back to this page
  location.replace(APP_URL);
  // If the browser blocked the redirect, show a button after 3 seconds
  setTimeout(() => document.getElementById('go').classList.add('show'), 3000);
</script>
</body>
</html>
